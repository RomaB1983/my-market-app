spring.main.web-application-type=reactive

spring.r2dbc.url=r2dbc:h2:mem:///shopdb_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.r2dbc.username=sa
spring.r2dbc.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.sql.init.mode=always

spring.security.oauth2.client.registration.shop-client.client-id=shop
spring.security.oauth2.client.registration.shop-client.client-secret=shop-secret
spring.security.oauth2.client.registration.shop-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.shop-client.scope=payments.read,payments.write
spring.security.oauth2.client.provider.shop-client.token-uri=http://localhost:3000/oauth2/token

spring.thymeleaf.cache=false
